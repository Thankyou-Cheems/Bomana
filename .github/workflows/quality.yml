name: Public browser quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: native/telemetry_gateway/go.sum
      - name: Verify public source and builds (no production credentials)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global pnpm@11.3.0
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend check
          go -C native/telemetry_gateway test -count=1 ./...
          go -C native/telemetry_gateway vet ./...
