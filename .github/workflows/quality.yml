name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows Ruff and smoke
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install development dependencies
        shell: pwsh
        run: |
          uv sync --extra dev --frozen

      - name: Ruff check
        shell: pwsh
        run: |
          uv run --extra dev ruff check .

      - name: Ruff format check
        shell: pwsh
        run: |
          uv run --extra dev ruff format --check .

      - name: Lightweight smoke
        shell: cmd
        run: |
          tools\scripts\check_smoke.bat

      - name: Native hotkey broker checks
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup component add rustfmt --toolchain 1.94.0
          rustup default 1.94.0
          cargo fmt --check --manifest-path native/hotkey_broker/Cargo.toml
          cargo fmt --check --manifest-path native/hotkey_broker_setup/Cargo.toml
          cargo test --locked --manifest-path native/hotkey_broker/Cargo.toml
          uv run --frozen python tools/build_hotkey_broker.py --mode dev
