name: Build and Release Bomana Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 6.7.0)，留空则从源代码提取"
        required: false
        type: string
      build_target:
        description: "构建目标"
        required: false
        default: all
        type: choice
        options:
          - all
          - app
          - launcher

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONNOUSERSITE: "1"
  PYTHONPATH: ""
  PYTHONHOME: ""

jobs:
  prepare:
    name: 准备构建信息
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      launcher_version: ${{ steps.version.outputs.launcher_version }}
      build_target: ${{ steps.version.outputs.build_target }}
      build_desc: ${{ steps.version.outputs.build_desc }}
      asset_desc: ${{ steps.version.outputs.asset_desc }}
      release_name: ${{ steps.version.outputs.release_name }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 提取版本号
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_BUILD_TARGET: ${{ github.event.inputs.build_target || '' }}
        run: |
          set -euo pipefail

          SEMVER_RE='^[0-9]+[.][0-9]+[.][0-9]+$'
          TAG_RE='^v([0-9]+[.][0-9]+[.][0-9]+)(-(app|launcher))?$'

          validate_version() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ $SEMVER_RE ]]; then
              echo "::error::$label must match X.Y.Z, got: $value"
              exit 1
            fi
          }

          TAG_REF="${GITHUB_REF#refs/tags/}"
          AUTO_TARGET=""

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            validate_version "workflow_dispatch version" "$VERSION"
            echo "版本来源: 手动输入"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ ! "$TAG_REF" =~ $TAG_RE ]]; then
              echo "::error::release tag must match vX.Y.Z, vX.Y.Z-app, or vX.Y.Z-launcher; got: $TAG_REF"
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
            case "${BASH_REMATCH[3]:-}" in
              app)
                AUTO_TARGET="app"
                echo "版本来源: Git Tag (app only)"
                ;;
              launcher)
                AUTO_TARGET="launcher"
                echo "版本来源: Git Tag (launcher only)"
                ;;
              *)
                echo "版本来源: Git Tag"
                ;;
            esac
          else
            VERSION=$(grep -oP '__version__\s*=\s*["\x27]\K[^"\x27]+' bomana/metadata.py || true)
            if [ -z "$VERSION" ]; then
              echo "::error::无法从 bomana/metadata.py 提取 __version__"
              exit 1
            fi
            validate_version "source version" "$VERSION"
            echo "版本来源: 源代码 bomana/metadata.py __version__"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="$TAG_REF"
          else
            TAG_NAME="v$VERSION"
          fi
          LAUNCHER_VERSION=$(grep -oP 'LAUNCHER_VERSION\s*=\s*["\x27]\K[^"\x27]+' launcher/metadata.py || echo "")
          if [ -z "$LAUNCHER_VERSION" ]; then
            echo "无法从 launcher/metadata.py 提取 LAUNCHER_VERSION"
            exit 1
          fi
          validate_version "launcher version" "$LAUNCHER_VERSION"
          BUILD_TARGET="$INPUT_BUILD_TARGET"
          if [ -z "$BUILD_TARGET" ]; then
            [ -n "$AUTO_TARGET" ] && BUILD_TARGET="$AUTO_TARGET" || BUILD_TARGET="all"
          fi

          case "$BUILD_TARGET" in
            all)
              BUILD_DESC="完整发布（启动器 + 三通道应用包）"
              RELEASE_NAME="Bomana v$VERSION"
              ASSET_DESC=$'- 启动器：`Bomana_launcher_v*.exe`\n- 签名热键组件安装器：`BomanaHotkeyBrokerSetup.exe`\n- 启动器清单：`launcher_manifest.json`\n- 应用包：`Bomana_app_Enhanced_v*.zip` / `Bomana_app_Standard_v*.zip` / `Bomana_app_Lite_v*.zip`\n- 清单：`manifest_Enhanced.json` / `manifest_Standard.json` / `manifest_Lite.json`\n- 校验：`checksums_launcher.txt` + `checksums_hotkey_broker.txt` + `checksums_app_*.txt`'
              ;;
            app)
              BUILD_DESC="应用包发布（Enhanced/Standard/Lite）"
              RELEASE_NAME="Bomana v$VERSION · App Packages"
              ASSET_DESC=$'- 应用包：`Bomana_app_Enhanced_v*.zip` / `Bomana_app_Standard_v*.zip` / `Bomana_app_Lite_v*.zip`\n- 清单：`manifest_Enhanced.json` / `manifest_Standard.json` / `manifest_Lite.json`\n- 校验：`checksums_app_*.txt`'
              ;;
            launcher)
              BUILD_DESC="启动器发布（通用启动器）"
              RELEASE_NAME="Bomana v$VERSION · Launcher"
              ASSET_DESC=$'- 启动器：`Bomana_launcher_v*.exe`\n- 签名热键组件安装器：`BomanaHotkeyBrokerSetup.exe`\n- 启动器清单：`launcher_manifest.json`\n- 校验：`checksums_launcher.txt` + `checksums_hotkey_broker.txt`'
              ;;
            *)
              echo "未知构建目标: $BUILD_TARGET"
              exit 1
              ;;
          esac

          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'launcher_version=%s\n' "$LAUNCHER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag_name=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'build_target=%s\n' "$BUILD_TARGET" >> "$GITHUB_OUTPUT"
          printf 'build_desc=%s\n' "$BUILD_DESC" >> "$GITHUB_OUTPUT"
          printf 'release_name=%s\n' "$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "asset_desc<<ASSET_DESC_EOF"
            echo "$ASSET_DESC"
            echo "ASSET_DESC_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "提取到版本号: $VERSION"
          echo "提取到启动器内部版本: $LAUNCHER_VERSION"
          echo "构建目标: $BUILD_TARGET"
          echo "发布说明: $BUILD_DESC"

      - name: 生成更新日志
        id: changelog
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges -n 15)
            else
              CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -15)
            fi
          else
            CHANGELOG="手动触发构建 / 开发版本"
          fi
          delimiter="CHANGELOG_EOF_$(date +%s%N)"
          {
            echo "changelog<<$delimiter"
            echo "$CHANGELOG"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: 发布前质量门
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install development dependencies
        shell: pwsh
        run: |
          uv sync --extra dev --frozen

      - name: Ruff check
        shell: pwsh
        run: |
          uv run --frozen --extra dev ruff check .

      - name: Ruff format check
        shell: pwsh
        run: |
          uv run --frozen --extra dev ruff format --check .

      - name: Pytest smoke
        shell: cmd
        run: |
          tools\scripts\check_smoke.bat

      - name: Native hotkey broker checks
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup component add rustfmt --toolchain 1.94.0
          rustup default 1.94.0
          cargo fmt --check --manifest-path native/hotkey_broker/Cargo.toml
          cargo fmt --check --manifest-path native/hotkey_broker_setup/Cargo.toml
          cargo test --locked --manifest-path native/hotkey_broker/Cargo.toml
          uv run --frozen python tools/build_hotkey_broker.py --mode dev

  build_app:
    name: 构建应用包 ${{ matrix.variant.name }}
    needs: [prepare, quality]
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'app'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: "增强版", slug: "Enhanced", description: "全功能，含CCRP投弹预测" }
          - { name: "标准版", slug: "Standard", description: "含导航与燃油管理，无CCRP" }
          - { name: "精简版", slug: "Lite", description: "仅计时器，极致轻量" }

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: 安装依赖（uv）
        shell: pwsh
        run: |
          uv sync --extra build --frozen

      - name: 构建应用包
        shell: pwsh
        env:
          BUILD_VARIANT: ${{ matrix.variant.slug }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BOMANA_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PRIVATE_KEY }}
          BOMANA_RELEASE_ED25519_PUBLIC_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PUBLIC_KEY }}
          BOMANA_RELEASE_SIGNING_KEY_ID: bomana-release-2026-06
        run: |
          uv run --frozen python tools/build_portable.py `
            --variant "$env:BUILD_VARIANT" `
            --target "app" `
            --version "$env:BUILD_VERSION" `
            --output "dist"

      - name: 上传应用包产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Bomana-AppPackage-${{ matrix.variant.slug }}
          path: |
            dist/Bomana_app_${{ matrix.variant.slug }}_v${{ needs.prepare.outputs.version }}.zip
            dist/manifest_${{ matrix.variant.slug }}.json
            dist/checksums_app_${{ matrix.variant.slug }}.txt

  build_launcher:
    name: 构建通用启动器
    needs: [prepare, quality]
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'launcher'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: 安装依赖（uv）
        shell: pwsh
        run: |
          uv sync --extra build --frozen

      - name: 构建启动器
        shell: pwsh
        env:
          BUILD_LAUNCHER_VERSION: ${{ needs.prepare.outputs.launcher_version }}
          BOMANA_RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PRIVATE_KEY }}
          BOMANA_RELEASE_ED25519_PUBLIC_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PUBLIC_KEY }}
          BOMANA_RELEASE_SIGNING_KEY_ID: bomana-release-2026-06
        run: |
          uv run --frozen python tools/build_portable.py `
            --target "launcher" `
            --version "$env:BUILD_LAUNCHER_VERSION" `
            --output "dist"

      - name: 上传启动器产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Bomana-Launcher
          path: |
            dist/Bomana_launcher_v${{ needs.prepare.outputs.launcher_version }}.exe
            dist/launcher_manifest.json
            dist/checksums_launcher.txt

  build_hotkey_broker:
    name: 构建并签名热键组件
    needs: [prepare, quality]
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'launcher'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup component add rustfmt --toolchain 1.94.0
          rustup default 1.94.0
          rustc -V

      - name: Build and Authenticode-sign broker
        shell: pwsh
        env:
          BOMANA_AUTHENTICODE_PFX_B64: ${{ secrets.BOMANA_AUTHENTICODE_PFX_B64 }}
          BOMANA_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.BOMANA_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          uv run --frozen python tools/build_hotkey_broker.py `
            --mode release `
            --output dist

      - name: Upload hotkey broker artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Bomana-HotkeyBroker
          path: |
            dist/BomanaHotkeyBroker.exe
            dist/BomanaHotkeyBrokerSetup.exe
            dist/checksums_hotkey_broker.txt

  release:
    name: 发布正式版本
    needs: [prepare, quality, build_app, build_launcher, build_hotkey_broker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && always() && needs.quality.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build_app.result) && contains(fromJSON('["success","skipped"]'), needs.build_launcher.result) && contains(fromJSON('["success","skipped"]'), needs.build_hotkey_broker.result)

    steps:
      - name: 下载产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release_files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: |
            ## 🚀 本次发布类型
            **${{ needs.prepare.outputs.build_desc }}**

            > Tag 规则：`vX.Y.Z` = 全量；`vX.Y.Z-app` = 仅应用包；`vX.Y.Z-launcher` = 仅启动器。

            ## 📝 更新日志
            ${{ needs.prepare.outputs.changelog }}

            ## 📦 本次包含产物
            ${{ needs.prepare.outputs.asset_desc }}

            > 云端自动构建：推送 `vX.Y.Z` / `vX.Y.Z-app` / `vX.Y.Z-launcher` 标签后，GitHub Actions 会按标签类型自动构建并发布。

            ## 🔐 安全验证
            启动器会校验发布清单内置的 Ed25519 签名，并使用 SHA256 校验下载文件完整性。
            手动下载时也可使用对应的 `checksums_*.txt` 文件复核文件完整性。

            ## 📄 许可证
            本软件基于 MIT 许可证开源。
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
