name: Build and Release Bomana Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: 6.7.0)，留空则从源代码提取"
        required: false
        type: string
      build_target:
        description: "构建目标"
        required: false
        default: all
        type: choice
        options:
          - all
          - app
          - launcher

permissions:
  contents: write

jobs:
  prepare:
    name: 准备构建信息
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_target: ${{ steps.version.outputs.build_target }}
      build_desc: ${{ steps.version.outputs.build_desc }}
      asset_desc: ${{ steps.version.outputs.asset_desc }}
      release_name: ${{ steps.version.outputs.release_name }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          TAG_REF="${GITHUB_REF#refs/tags/}"
          AUTO_TARGET=""

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "版本来源: 手动输入"
          elif [[ "$TAG_REF" =~ ^v(.+)-app$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            AUTO_TARGET="app"
            echo "版本来源: Git Tag (app only)"
          elif [[ "$TAG_REF" =~ ^v(.+)-launcher$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            AUTO_TARGET="launcher"
            echo "版本来源: Git Tag (launcher only)"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "版本来源: Git Tag"
          else
            VERSION=$(grep -oP '__version__\s*=\s*["\x27]\K[^"\x27]+' bomana/config.py || echo "dev")
            echo "版本来源: 源代码 __version__"
          fi

          TAG_NAME="$TAG_REF"
          [ "$TAG_NAME" == "$GITHUB_REF" ] && TAG_NAME="v$VERSION"
          BUILD_TARGET="${{ github.event.inputs.build_target }}"
          if [ -z "$BUILD_TARGET" ]; then
            [ -n "$AUTO_TARGET" ] && BUILD_TARGET="$AUTO_TARGET" || BUILD_TARGET="all"
          fi

          case "$BUILD_TARGET" in
            all)
              BUILD_DESC="完整发布（启动器 + 三通道应用包）"
              RELEASE_NAME="Bomana v$VERSION"
              ASSET_DESC=$'- 启动器：`Bomana_launcher_v*.exe`\n- 应用包：`Bomana_app_Enhanced_v*.zip` / `Bomana_app_Standard_v*.zip` / `Bomana_app_Lite_v*.zip`\n- 清单：`manifest_Enhanced.json` / `manifest_Standard.json` / `manifest_Lite.json`\n- 校验：`checksums_launcher.txt` + `checksums_app_*.txt`'
              ;;
            app)
              BUILD_DESC="应用包发布（Enhanced/Standard/Lite）"
              RELEASE_NAME="Bomana v$VERSION · App Packages"
              ASSET_DESC=$'- 应用包：`Bomana_app_Enhanced_v*.zip` / `Bomana_app_Standard_v*.zip` / `Bomana_app_Lite_v*.zip`\n- 清单：`manifest_Enhanced.json` / `manifest_Standard.json` / `manifest_Lite.json`\n- 校验：`checksums_app_*.txt`'
              ;;
            launcher)
              BUILD_DESC="启动器发布（通用启动器）"
              RELEASE_NAME="Bomana v$VERSION · Launcher"
              ASSET_DESC=$'- 启动器：`Bomana_launcher_v*.exe`\n- 校验：`checksums_launcher.txt`'
              ;;
            *)
              echo "未知构建目标: $BUILD_TARGET"
              exit 1
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "build_target=$BUILD_TARGET" >> "$GITHUB_OUTPUT"
          echo "build_desc=$BUILD_DESC" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "asset_desc<<EOF"
            echo "$ASSET_DESC"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "提取到版本号: $VERSION"
          echo "构建目标: $BUILD_TARGET"
          echo "发布说明: $BUILD_DESC"

      - name: 生成更新日志
        id: changelog
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -15)
            else
              CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -15)
            fi
          else
            CHANGELOG="手动触发构建 / 开发版本"
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build_app:
    name: 构建应用包 ${{ matrix.variant.name }}
    needs: prepare
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'app'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: "增强版", slug: "Enhanced", description: "全功能，含CCRP投弹预测" }
          - { name: "标准版", slug: "Standard", description: "含导航与燃油管理，无CCRP" }
          - { name: "精简版", slug: "Lite", description: "仅计时器，极致轻量" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pyinstaller

      - name: 构建应用包
        shell: pwsh
        run: |
          python tools/build_portable.py `
            --variant "${{ matrix.variant.slug }}" `
            --target "app" `
            --version "${{ needs.prepare.outputs.version }}" `
            --output "dist"

      - name: 上传应用包产物
        uses: actions/upload-artifact@v4
        with:
          name: Bomana-AppPackage-${{ matrix.variant.slug }}
          path: |
            dist/Bomana_app_${{ matrix.variant.slug }}_v${{ needs.prepare.outputs.version }}.zip
            dist/manifest_${{ matrix.variant.slug }}.json
            dist/checksums_app_${{ matrix.variant.slug }}.txt

  build_launcher:
    name: 构建通用启动器
    needs: prepare
    if: needs.prepare.outputs.build_target == 'all' || needs.prepare.outputs.build_target == 'launcher'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt pyinstaller

      - name: 构建启动器
        shell: pwsh
        run: |
          python tools/build_portable.py `
            --target "launcher" `
            --version "${{ needs.prepare.outputs.version }}" `
            --output "dist"

      - name: 上传启动器产物
        uses: actions/upload-artifact@v4
        with:
          name: Bomana-Launcher
          path: |
            dist/Bomana_launcher_v${{ needs.prepare.outputs.version }}.exe
            dist/checksums_launcher.txt

  release:
    name: 发布正式版本
    needs: [prepare, build_app, build_launcher]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && always() && contains(fromJSON('["success","skipped"]'), needs.build_app.result) && contains(fromJSON('["success","skipped"]'), needs.build_launcher.result)

    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: |
            ## 🚀 本次发布类型
            **${{ needs.prepare.outputs.build_desc }}**

            > Tag 规则：`vX.Y.Z` = 全量；`vX.Y.Z-app` = 仅应用包；`vX.Y.Z-launcher` = 仅启动器。

            ## 📝 更新日志
            ${{ needs.prepare.outputs.changelog }}

            ## 📦 本次包含产物
            ${{ needs.prepare.outputs.asset_desc }}

            > 云端自动构建：推送 `vX.Y.Z` / `vX.Y.Z-app` / `vX.Y.Z-launcher` 标签后，GitHub Actions 会按标签类型自动构建并发布。

            ## 🔐 安全验证
            请下载对应的 `checksums_*.txt` 文件，使用 SHA256 校验确保文件完整性。

            ## 📄 许可证
            本软件基于 MIT 许可证开源。
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
