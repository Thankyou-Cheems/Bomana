name: Deploy Update Assets To Server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (leave empty to use latest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy-assets:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      deploy_app: ${{ steps.resolve.outputs.deploy_app }}
      deploy_launcher: ${{ steps.resolve.outputs.deploy_launcher }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release and download update assets
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p stage/manifests stage/downloads stage/root
          SHOULD_DEPLOY="false"
          DEPLOY_APP="false"
          DEPLOY_LAUNCHER="false"

          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
            API_URL="https://api.github.com/repos/$REPO/releases/tags/$TAG"
          else
            TAG="latest"
            API_URL="https://api.github.com/repos/$REPO/releases/latest"
          fi

          echo "Using release source: $TAG"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" > release.json

          download_asset() {
            local name="$1"
            local dest="$2"
            local url
            url="$(jq -r --arg NAME "$name" '.assets[] | select(.name == $NAME) | .browser_download_url' release.json | head -n 1)"
            if [[ -z "$url" || "$url" == "null" ]]; then
              return 1
            fi
            curl -fL "$url" -o "$dest"
            return 0
          }

          validate_manifest_signature() {
            local path="$1"
            jq -e '
              .manifest_signature.algorithm == "ed25519" and
              (.manifest_signature.key_id | type == "string" and length > 0) and
              (.manifest_signature.signature | type == "string" and length > 0)
            ' "$path" >/dev/null
          }

          app_complete="true"
          for CH in Enhanced Standard Lite; do
            MANIFEST_NAME="manifest_${CH}.json"
            ZIP_NAME="$(jq -r --arg CH "$CH" '.assets[] | select(.name | test("^Bomana_app_" + $CH + "_v.+\\.zip$")) | .name' release.json | head -n 1)"
            CHECKSUM_NAME="checksums_app_${CH}.txt"
            if [[ -z "$ZIP_NAME" || "$ZIP_NAME" == "null" ]]; then
              app_complete="false"
              break
            fi
            download_asset "$MANIFEST_NAME" "stage/manifests/$MANIFEST_NAME" || { app_complete="false"; break; }
            validate_manifest_signature "stage/manifests/$MANIFEST_NAME" || { echo "Unsigned app manifest: $MANIFEST_NAME"; app_complete="false"; break; }
            download_asset "$ZIP_NAME" "stage/downloads/$ZIP_NAME" || { app_complete="false"; break; }
            download_asset "$CHECKSUM_NAME" "stage/downloads/$CHECKSUM_NAME" || true
          done

          if [[ "$app_complete" == "true" ]]; then
            SHOULD_DEPLOY="true"
            DEPLOY_APP="true"
          else
            rm -f stage/manifests/* stage/downloads/Bomana_app_* stage/downloads/checksums_app_*
          fi

          LAUNCHER_NAME="$(jq -r '.assets[] | select(.name | test("^Bomana_launcher_v.+\\.exe$")) | .name' release.json | head -n 1)"
          if [[ -n "$LAUNCHER_NAME" && "$LAUNCHER_NAME" != "null" ]]; then
            if download_asset "$LAUNCHER_NAME" "stage/downloads/$LAUNCHER_NAME" && \
               download_asset "launcher_manifest.json" "stage/root/launcher_manifest.json"; then
              if validate_manifest_signature "stage/root/launcher_manifest.json"; then
                SHOULD_DEPLOY="true"
                DEPLOY_LAUNCHER="true"
                download_asset "checksums_launcher.txt" "stage/downloads/checksums_launcher.txt" || true
              else
                echo "Unsigned launcher manifest: launcher_manifest.json"
                rm -f "stage/downloads/$LAUNCHER_NAME" stage/root/launcher_manifest.json stage/downloads/checksums_launcher.txt
              fi
            else
              rm -f "stage/downloads/$LAUNCHER_NAME" stage/root/launcher_manifest.json stage/downloads/checksums_launcher.txt
            fi
          fi

          if [[ "$SHOULD_DEPLOY" != "true" ]]; then
            echo "No deployable update assets found in release $TAG."
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "deploy_app=$DEPLOY_APP" >> "$GITHUB_OUTPUT"
          echo "deploy_launcher=$DEPLOY_LAUNCHER" >> "$GITHUB_OUTPUT"

      - name: Validate staged release signatures and assets
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          DEPLOY_APP: ${{ steps.resolve.outputs.deploy_app }}
          DEPLOY_LAUNCHER: ${{ steps.resolve.outputs.deploy_launcher }}
          BOMANA_RELEASE_ED25519_PUBLIC_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PUBLIC_KEY }}
          BOMANA_RELEASE_SIGNING_KEY_ID: bomana-release-2026-06
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from bomana.launcher_core import verify_release_manifest_signature

          public_key = os.environ.get("BOMANA_RELEASE_ED25519_PUBLIC_KEY", "").strip()
          key_id = os.environ.get("BOMANA_RELEASE_SIGNING_KEY_ID", "").strip()
          if not public_key or not key_id:
              raise SystemExit("missing release signing public key configuration")
          public_keys = {key_id: public_key}
          stage = Path("stage")

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as file_obj:
                  for chunk in iter(lambda: file_obj.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest().lower()

          def asset_path(name: object, field_name: str) -> Path:
              if not isinstance(name, str) or not name.strip() or "/" in name or "\\" in name:
                  raise SystemExit(f"{field_name} must be a filename")
              path = stage / "downloads" / name
              if not path.exists():
                  raise SystemExit(f"missing release asset: {path}")
              return path

          if os.environ.get("DEPLOY_APP") == "true":
              for channel in ("Enhanced", "Standard", "Lite"):
                  manifest_path = stage / "manifests" / f"manifest_{channel}.json"
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  verify_release_manifest_signature(
                      manifest,
                      manifest_label=f"{manifest_path.name} ",
                      public_keys=public_keys,
                      expected_kind="app",
                  )
                  package = asset_path(manifest.get("package_asset"), "package_asset")
                  if sha256_file(package) != str(manifest.get("package_sha256", "")).lower():
                      raise SystemExit(f"{package.name} sha256 mismatch")

          if os.environ.get("DEPLOY_LAUNCHER") == "true":
              manifest_path = stage / "root" / "launcher_manifest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              verify_release_manifest_signature(
                  manifest,
                  manifest_label=f"{manifest_path.name} ",
                  public_keys=public_keys,
                  expected_kind="launcher",
              )
              launcher = asset_path(manifest.get("launcher_asset"), "launcher_asset")
              if sha256_file(launcher) != str(manifest.get("launcher_sha256", "")).lower():
                  raise SystemExit(f"{launcher.name} sha256 mismatch")
          PY

      - name: Setup SSH key
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload update assets to remote staging
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          STAGE_DIR="/tmp/bomana-update-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTS=(
            -p "$SERVER_PORT"
            -i ~/.ssh/id_ed25519
            -o BatchMode=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$STAGE_DIR' && chmod 700 '$STAGE_DIR'"

          mapfile -t stage_files < <(cd stage && find . -type f | sort)
          if [[ "${#stage_files[@]}" -eq 0 ]]; then
            echo "ERROR: no staged files found to upload"
            exit 1
          fi

          total_files="${#stage_files[@]}"
          for idx in "${!stage_files[@]}"; do
            rel_path="${stage_files[$idx]#./}"
            local_path="stage/$rel_path"
            remote_path="$STAGE_DIR/stage/$rel_path"
            remote_dir="$(dirname "$remote_path")"
            size_h="$(du -h "$local_path" | cut -f1)"
            echo "[$((idx + 1))/$total_files] Uploading $rel_path ($size_h)"
            ssh "${SSH_OPTS[@]}" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$remote_dir'"
            rsync -aW --partial --human-readable --progress \
              -e "ssh ${SSH_OPTS[*]}" \
              "$local_path" "$SERVER_USER@$SERVER_HOST:$remote_path"
          done

      - name: Sync assets into target directories
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_APP: ${{ steps.resolve.outputs.deploy_app }}
          DEPLOY_LAUNCHER: ${{ steps.resolve.outputs.deploy_launcher }}
        run: |
          set -euo pipefail
          STAGE_DIR="/tmp/bomana-update-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/stage"
          ssh -p "$SERVER_PORT" -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" \
            "export DEPLOY_APP='$DEPLOY_APP'
            export DEPLOY_LAUNCHER='$DEPLOY_LAUNCHER'
            export STAGE_DIR='$STAGE_DIR'
            export MANIFEST_DIR='/opt/stacks/bomana-update/data/manifests'
            export DOWNLOAD_DIR='/opt/stacks/bomana-update/data/downloads'
            export LAUNCHER_MANIFEST='/opt/stacks/bomana-update/data/launcher_manifest.json'
            bash -s" <<'EOF'
          set -euo pipefail

          install_many() {
            local dest_dir="$1"
            shift
            if [[ "$#" -eq 0 ]]; then
              return
            fi
            if mkdir -p "$dest_dir" 2>/dev/null && test -w "$dest_dir"; then
              install -m 644 "$@" "$dest_dir"/
              return
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo mkdir -p "$dest_dir"
              sudo install -m 644 "$@" "$dest_dir"/
              return
            fi
            echo "ERROR: no write permission to $dest_dir"
            exit 1
          }

          install_file() {
            local src="$1"
            local dest="$2"
            local dest_dir
            dest_dir="$(dirname "$dest")"
            if mkdir -p "$dest_dir" 2>/dev/null && test -w "$dest_dir"; then
              install -m 644 "$src" "$dest"
              return
            fi
            if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo mkdir -p "$dest_dir"
              sudo install -m 644 "$src" "$dest"
              return
            fi
            echo "ERROR: no write permission to $dest"
            exit 1
          }

          if [[ "$DEPLOY_APP" == "true" ]]; then
            mapfile -t app_manifests < <(compgen -G "$STAGE_DIR/manifests/manifest_*.json" || true)
            mapfile -t app_archives < <(compgen -G "$STAGE_DIR/downloads/Bomana_app_*.zip" || true)
            mapfile -t app_checksums < <(compgen -G "$STAGE_DIR/downloads/checksums_app_*.txt" || true)
            install_many "$MANIFEST_DIR" "${app_manifests[@]}"
            install_many "$DOWNLOAD_DIR" "${app_archives[@]}"
            if [[ "${#app_checksums[@]}" -gt 0 ]]; then
              install_many "$DOWNLOAD_DIR" "${app_checksums[@]}"
            fi
          fi

          if [[ "$DEPLOY_LAUNCHER" == "true" ]]; then
            mapfile -t launcher_archives < <(compgen -G "$STAGE_DIR/downloads/Bomana_launcher_v*.exe" || true)
            install_many "$DOWNLOAD_DIR" "${launcher_archives[@]}"
            if [[ -f "$STAGE_DIR/downloads/checksums_launcher.txt" ]]; then
              install_many "$DOWNLOAD_DIR" "$STAGE_DIR/downloads/checksums_launcher.txt"
            fi
            install_file "$STAGE_DIR/root/launcher_manifest.json" "$LAUNCHER_MANIFEST"
          fi

          rm -rf "$(dirname "$STAGE_DIR")"
          EOF

      - name: Verify files on server
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_APP: ${{ steps.resolve.outputs.deploy_app }}
          DEPLOY_LAUNCHER: ${{ steps.resolve.outputs.deploy_launcher }}
        run: |
          set -euo pipefail
          ssh -p "$SERVER_PORT" -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" \
            "export DEPLOY_APP='$DEPLOY_APP'
            export DEPLOY_LAUNCHER='$DEPLOY_LAUNCHER'
            bash -s" <<'EOF'
          set -euo pipefail
          if [[ "$DEPLOY_APP" == "true" ]]; then
            ls -l /opt/stacks/bomana-update/data/manifests/manifest_*.json
            ls -l /opt/stacks/bomana-update/data/downloads/Bomana_app_*.zip
            python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path("/opt/stacks/bomana-update/data/manifests").glob("manifest_*.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              sig = data.get("manifest_signature")
              if not isinstance(sig, dict) or sig.get("algorithm") != "ed25519":
                  raise SystemExit(f"missing Ed25519 manifest_signature: {path}")
          PY
          fi
          if [[ "$DEPLOY_LAUNCHER" == "true" ]]; then
            ls -l /opt/stacks/bomana-update/data/launcher_manifest.json
            ls -l /opt/stacks/bomana-update/data/downloads/Bomana_launcher_v*.exe
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/opt/stacks/bomana-update/data/launcher_manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          sig = data.get("manifest_signature")
          if not isinstance(sig, dict) or sig.get("algorithm") != "ed25519":
              raise SystemExit(f"missing Ed25519 manifest_signature: {path}")
          PY
          fi
          EOF

      - name: Verify public update endpoints
        if: steps.resolve.outputs.should_deploy == 'true'
        shell: bash
        env:
          DEPLOY_APP: ${{ steps.resolve.outputs.deploy_app }}
          DEPLOY_LAUNCHER: ${{ steps.resolve.outputs.deploy_launcher }}
          PUBLIC_UPDATE_BASE_URL: https://bomanaupdate.ruikang.wang
          BOMANA_RELEASE_ED25519_PUBLIC_KEY: ${{ secrets.BOMANA_RELEASE_ED25519_PUBLIC_KEY }}
          BOMANA_RELEASE_SIGNING_KEY_ID: bomana-release-2026-06
        run: |
          set -euo pipefail
          verify_signed_payload() {
            local label="$1"
            local url="$2"
            local expected_field="$3"
            local expected_value="$4"
            local expected_kind="$5"
            python3 - "$label" "$url" "$expected_field" "$expected_value" "$expected_kind" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          from bomana.launcher_core import verify_release_manifest_signature

          label, url, expected_field, expected_value, expected_kind = sys.argv[1:6]
          public_key = os.environ.get("BOMANA_RELEASE_ED25519_PUBLIC_KEY", "").strip()
          key_id = os.environ.get("BOMANA_RELEASE_SIGNING_KEY_ID", "").strip()
          public_base_url = os.environ.get("PUBLIC_UPDATE_BASE_URL", "").strip()
          if not public_key or not key_id:
              raise SystemExit("missing release signing public key configuration")
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          if str(payload.get(expected_field, "")) != expected_value:
              raise SystemExit(f"{label} {expected_field} mismatch: {payload}")
          verify_release_manifest_signature(
              payload,
              manifest_label=f"{label} ",
              public_keys={key_id: public_key},
              expected_kind=expected_kind,
          )

          if expected_kind == "launcher":
              expected_sha = str(payload.get("launcher_sha256", "")).strip().lower()
              alias_sha = str(payload.get("package_sha256", "")).strip().lower()
              if alias_sha and alias_sha != expected_sha:
                  raise SystemExit("launcher package_sha256 alias does not match launcher_sha256")
          else:
              expected_sha = str(payload.get("package_sha256", "")).strip().lower()
          if not expected_sha:
              raise SystemExit(f"{label} missing signed sha256")
          package_url = str(payload.get("package_url", "")).strip()
          if not package_url:
              raise SystemExit(f"{label} missing package_url")
          asset_url = urllib.parse.urljoin(public_base_url.rstrip("/") + "/", package_url.lstrip("/"))
          digest = hashlib.sha256()
          with urllib.request.urlopen(asset_url, timeout=60) as response:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
          if digest.hexdigest().lower() != expected_sha:
              raise SystemExit(f"{label} public asset sha256 mismatch: {asset_url}")
          print(f"verified_signed_{label}={expected_value} sha={expected_sha[:12]}")
          PY
          }
          if [[ "$DEPLOY_APP" == "true" ]]; then
            for CH in Enhanced Standard Lite; do
              expected_version="$(jq -r '.app_version' "stage/manifests/manifest_${CH}.json")"
              verify_signed_payload \
                "app_${CH}" \
                "${PUBLIC_UPDATE_BASE_URL}/api/v1/version?channel=${CH}&local_version=0.0.0&launcher_version=999.0.0" \
                "app_version" \
                "$expected_version" \
                "app"
            done
          fi
          if [[ "$DEPLOY_LAUNCHER" == "true" ]]; then
            expected_launcher="$(jq -r '.launcher_version' stage/root/launcher_manifest.json)"
            verify_signed_payload \
              "launcher" \
              "${PUBLIC_UPDATE_BASE_URL}/api/v1/launcher?launcher_version=0.0.0" \
              "launcher_version" \
              "$expected_launcher" \
              "launcher"
          fi
