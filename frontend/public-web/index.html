<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dcecf8"><meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="../src/generated/bomana-logo.svg">
  <title>Bomana · 飞行导航</title>
  <script type="module" src="../src/public-bootstrap.ts"></script>
</head>
<body>
  <main class="stage" id="stage">
    <div class="map-stage standard-only" id="tactical-map-panel">
      <canvas id="navigation-map" width="1600" height="900" aria-label="官方战区和机场"></canvas>
      <div class="map-empty" id="map-empty">等待地图数据</div>
      <div class="map-vignette" aria-hidden="true"></div>
    </div>
    <header class="hud-top" id="hud-top"></header>

    <aside class="sortie-reset-undo" id="sortie-reset-undo" role="status" hidden>
      <div><strong>出击状态已重置</strong><span>30 秒内可撤销 · Ctrl+Z</span></div>
      <button id="undo-sortie-reset" hidden>撤销重置</button>
    </aside>
    <aside class="hud-left" id="hud-left" aria-label="飞行读数"></aside>

    <aside class="hud-right standard-only" aria-label="导航与出击信息">
      <div class="landing-slot" id="landing-slot"></div>
      <article class="glass panel navigation-card" id="navigation-panel">
        <div class="card-head"><h2>任务导航</h2></div>
        <div class="watch-block navigation-compact">
          <div class="navigation-target"><span>当前目标</span><strong id="navigation-target">暂无目标</strong></div>
          <div class="navigation-metrics"><span><i>方位</i><b id="navigation-bearing">---</b></span><span><i>距离</i><b id="navigation-distance">---</b></span></div>
          <div class="navigation-actions"><button class="ghost-btn" id="cycle-navigation-target">切换目标</button><button class="ghost-btn" id="clear-navigation-target">恢复自动</button></div>
          <select id="navigation-select" aria-label="选择导航目标"></select>
          <p class="meta" id="command-status" role="status"></p>
        </div>
      </article>
      <article class="glass panel alerts-card" id="alerts-panel">
        <div class="card-head"><h2>出击检查</h2></div>
        <div class="public-checklist" id="checklist"></div><p class="all-clear" id="alerts" role="status"></p>
      </article>
      <details class="glass panel encyclopedia"><summary>打击百科与摧毁计算器</summary><div class="encyclopedia-fields"><label>权重<select id="room-br"></select></label><label>目标<select id="damage-target"><option value="bombing_point">战区</option><option value="airport_module">机场模块</option></select></label><label>模块<select id="airport-module"><option value="airfield">跑道</option><option value="storage">油库</option><option value="parking">维修</option><option value="dwelling">生活区</option></select></label><label>机型<select id="damage-aircraft"></select></label><label>武器<select id="damage-weapon"></select></label><button class="ghost-btn" id="calculate-damage">计算枚数</button></div><p id="damage-result">选择参数后计算</p></details>
    </aside>
    <footer class="hud-bottom"><div class="rail rail-two"><button class="rail-btn rail-btn-primary" id="reset-timer"><strong>重置计时</strong></button><button class="rail-btn" id="open-settings"><strong>设置</strong></button></div></footer>
  </main>
  <dialog id="settings-dialog"><form method="dialog"><h2>飞行设置</h2><label class="standard-only"><input id="pip-map-visible" type="checkbox">置顶窗显示小地图</label><label>倒计时周期（分钟）<input id="cycle-minutes" type="number" min="1" max="180"></label><label>外观<select id="theme-select"><option value="glacier">浅色</option><option value="classic-dark">深色</option></select></label><label><input id="sound-enabled" type="checkbox">声音提示</label><label>倒计时音色<select id="sound-preset"><option value="classic">经典</option><option value="chime">铃声</option><option value="low">低音</option></select></label><label class="standard-only">检查项目（每行一项）<textarea id="checklist-items" rows="7"></textarea></label><button type="button" id="save-settings">保存设置</button><button id="close-settings">关闭</button></form></dialog>
  <dialog id="mobile-pairing-dialog"><h2>手机配对 · Standard</h2><p id="mobile-pairing-status">正在检查 Bridge…</p><select id="mobile-pairing-networks" aria-label="手机所在局域网"></select><p id="mobile-pairing-code"></p><img id="mobile-pairing-qr" alt="手机配对二维码" hidden><div class="actions"><button id="generate-mobile-pairing">生成二维码</button><button id="regenerate-mobile-pairing">重新配对</button><button id="close-mobile-pairing">关闭</button></div></dialog>
  <dialog id="pip-risk-dialog"><h2>打开置顶导航窗前请确认</h2><p>置顶窗通过浏览器读取 Bridge 转发的官方 8111 数据，不注入游戏、不读取游戏内存。该窗口没有 Gaijin 的明确兼容性保证；出现游戏或反作弊兼容警告时请关闭。</p><p><a href="https://legal.gaijin.net/codeofconduct" target="_blank" rel="noopener noreferrer">阅读 Gaijin 行为准则</a></p><label><input id="remember-pip-risk" type="checkbox">我已理解，以后不再提示</label><div class="actions"><button id="accept-pip-risk">我已理解并打开</button><button id="cancel-pip-risk">取消</button></div></dialog>
</body></html>
