[project]
name = "bomana"
version = "8.7.0"
description = "War Thunder SB timer and navigation assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.25.0",
    "certifi>=2021.0.0",
    "pillow>=8.0.0",
    "pystray>=0.17.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=5.13.0",
]
dev = [
    "fonttools>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --capture=sys"

[tool.ruff]
line-length = 100
respect-gitignore = false
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF005",
    "RUF012",
    "RUF013",
    "RUF046",
    "RUF059",
    "RUF100",
]
ignore = [
    "E501",
]
