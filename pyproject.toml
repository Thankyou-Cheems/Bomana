[project]
name = "bomana"
version = "6.13.1"
description = "War Thunder SB timer and navigation assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.25.0",
    "certifi>=2021.0.0",
    "pillow>=8.0.0",
    "pystray>=0.17.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=5.13.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",
]
